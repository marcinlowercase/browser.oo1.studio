<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="./assets/images/lob2-favicon.svg"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&family=Instrument+Serif:ital,wght@0,400;1,400&display=swap"
            rel="stylesheet"
        />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>the browser of oo1 studio</title>
        <link rel="stylesheet" href="https://assets.oo1.studio/outsync.css" />
        <link rel="stylesheet" href="./css/global.css" />
        <link rel="stylesheet" href="./css/home.css" />
        <script src="./js/home.js" defer></script>
    </head>
    <body>
        <div class="line-border line-left"></div>
        <div class="line-border line-right"></div>
        <div class="line-border line-top"></div>
        <div class="line-border line-bottom"></div>

        <div class="screen-border">
            <div class="screen-border-mask"></div>
        </div>

        <div id="brand">
            <div id="logo">
                <img src="./assets/images/lob2-a00.svg" alt="logo" class="logo-frame active" />
                <img src="./assets/images/lob2-a01.svg" alt="logo" class="logo-frame" />
                <img src="./assets/images/lob2-a02.svg" alt="logo" class="logo-frame" />
                <img src="./assets/images/lob2-a03.svg" alt="logo" class="logo-frame" />
                <img src="./assets/images/lob2-a04.svg" alt="logo" class="logo-frame" />
                <img src="./assets/images/lob2-a05.svg" alt="logo" class="logo-frame" />
                <img src="./assets/images/lob2-a06.svg" alt="logo" class="logo-frame" />
                <img src="./assets/images/lob2-a07.svg" alt="logo" class="logo-frame" />
            </div>

            <div id="name">
                <span class="nowrap">the browser</span>
                <span class="nowrap">of <a href="https://oo1.studio" target="_blank" rel="noopener noreferrer">oo1 studio</a></span>
            </div>

            <div id="nav">
                <div class="nav-links">
                    <a
                        href="https://play.google.com/store/apps/details?id=studio.oo1.browser"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="nav-item"
                    >
                        <img src="./assets/images/ic_download.svg" alt="" class="nav-icon" />
                        <span>download</span>
                    </a>

                    <a
                        href="https://github.com/marcinlowercase/a/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="nav-item"
                    >
                        <img src="./assets/images/ic_code.svg" alt="" class="nav-icon" />
                        <span>source</span>
                    </a>
                </div>

                <a
                    href="./privacy-policy.html"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="nav-item"
                >
                    <span>privacy policy</span>
                </a>
            </div>
        </div>
    </body>
</html>
